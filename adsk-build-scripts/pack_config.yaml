---
# README
# Please use 2 spaces, 
# indentation is sensitive
---
# Mapping: Label to Packing Variables
windows:
  qt5.win.debug:
  - x64 debug
  qt5.win.release:
  - x64 release
mac:
  qt5.mac:
  - universal
linux:
  qt5.lnx.ubuntu22.debug:
  - ubuntu22 debug gcc11
  qt5.lnx.ubuntu22.release:
  - ubuntu22 release gcc11
  qt5.lnx.rocky86.debug:
  - rocky86 debug gcc10
  qt5.lnx.rocky86.release:
  - rocky86 release gcc10
---
# Variables
variables:
  component_name: qt-lgpl
platforms:
  windows:
    variables:
      osName: win
      toolchain: v140
    configurations:
      release:
        variables:
          config: release
      debug:
        variables:
          config: debug
      x64:
        variables:
          compiler: intel64
  mac:
    variables:
      osName: osx-14.0
    configurations:
      universal:
        variables:
          compiler: ubx64arm64
          toolchain: clang700
          config: release
  linux:
    variables:
      osName: linux
    configurations:
      release:
        variables:
          config: release
      debug:
        variables:
          config: debug
      ubuntu22:
        variables:
          distro: ubuntu22
      rocky86:
        variables:
          distro: rocky8
      gcc11:
        variables:
          compiler: intel64
          toolchain: gcc11
      gcc10:
        variables:
          compiler: intel64
          toolchain: gcc10
---
# Nuspec Definition
linux:
- type: zip
  version: "${pkg_version}"
  adsk_xml_template: "adsk.xml.tpl"
  packages:
  - id: ${component_name}_${osName}-${distro}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/**/*"
      exclude: 'lib/libQt6VirtualKeyboard.so.6.5.3;lib/libQt6VirtualKeyboard.prl;lib/libQt6QuickTimeline.so.6.5.3;lib/libQt6QuickTimeline.prl;lib/libQt6Quick3DUtils.so.6.5.3;lib/libQt6Quick3DUtils.prl;lib/libQt6Quick3DSpatialAudio.so.6.5.3;lib/libQt6Quick3DSpatialAudio.prl;lib/libQt6Quick3DRuntimeRender.so.6.5.3;lib/libQt6Quick3DRuntimeRender.prl;lib/libQt6Quick3DPhysicsHelpers.so.6.5.3;lib/libQt6Quick3DPhysicsHelpers.prl;lib/libQt6Quick3DPhysics.so.6.5.3;lib/libQt6Quick3DPhysics.prl;lib/libQt6Quick3DParticles.so.6.5.3;lib/libQt6Quick3DParticles.prl;lib/libQt6Quick3DParticleEffects.so.6.5.3;lib/libQt6Quick3DParticleEffects.prl;lib/libQt6Quick3DIblBaker.so.6.5.3;lib/libQt6Quick3DIblBaker.prl;lib/libQt6Quick3DHelpersImpl.so.6.5.3;lib/libQt6Quick3DHelpersImpl.prl;lib/libQt6Quick3DHelpers.so.6.5.3;lib/libQt6Quick3DHelpers.prl;lib/libQt6Quick3DGlslParser.so.6.5.3;lib/libQt6Quick3DGlslParser.prl;lib/libQt6Quick3DEffects.so.6.5.3;lib/libQt6Quick3DEffects.prl;lib/libQt6Quick3DAssetUtils.so.6.5.3;lib/libQt6Quick3DAssetUtils.prl;lib/libQt6Quick3DAssetImport.so.6.5.3;lib/libQt6Quick3DAssetImport.prl;lib/libQt6Quick3D.so.6.5.3;lib/libQt6Quick3D.prl;lib/libQt6NetworkAuth.so.6.5.3;lib/libQt6NetworkAuth.prl;lib/libQt6DesignerComponents.so.6.5.3;lib/libQt6DesignerComponents.prl;lib/libQt6Designer.so.6.5.3;lib/libQt6Designer.prl;lib/libQt6DataVisualizationQml.so.6.5.3;lib/libQt6DataVisualizationQml.prl;lib/libQt6DataVisualization.so.6.5.3;lib/libQt6DataVisualization.prl;lib/libQt6ChartsQml.so.6.5.3;lib/libQt6ChartsQml.prl;lib/libQt6Charts.so.6.5.3;lib/libQt6Charts.prl;qml/QtQuick3D;qml/QtQuick/VirtualKeyboard;qml/QtQuick/Timeline;qml/QtDataVisualization;qml/QtCharts;qml/Qt/labs/lottieqt;lib/libQt6Coap.prl;lib/libQt6Coap.so;lib/libQt6Coap.so.6;lib/libQt6Coap.so.6.5.3;lib/libQt6Mqtt.prl;lib/libQt6Mqtt.so;lib/libQt6Mqtt.so.6;lib/libQt6Mqtt.so.6.5.3;lib/Qt6VirtualKeyboard.debug;lib/Qt6QuickTimeline.debug;lib/Qt6Quick3DUtils.debug;lib/Qt6Quick3DSpatialAudio.debug;lib/Qt6Quick3DRuntimeRender.debug;lib/Qt6Quick3DPhysicsHelpers.debug;lib/Qt6Quick3DPhysics.debug;lib/Qt6Quick3DParticles.debug;lib/Qt6Quick3DParticleEffects.debug;lib/Qt6Quick3DIblBaker.debug;lib/Qt6Quick3DHelpersImpl.debug;lib/Qt6Quick3DHelpers.debug;lib/Qt6Quick3DGlslParser.debug;lib/Qt6Quick3DEffects.debug;lib/Qt6Quick3DAssetUtils.debug;lib/Qt6Quick3DAssetImport.debug;lib/Qt6Quick3D.debug;lib/Qt6NetworkAuth.debug;lib/Qt6DesignerComponents.debug;lib/Qt6Designer.debug;lib/Qt6DataVisualizationQml.debug;lib/Qt6DataVisualization.debug;lib/Qt6ChartsQml.debug;lib/Qt6Charts.debug'
      target: "${pkg_version}"
- type: nupkg
  nuspec_file: ${component_name}.nuspec
  version: "${pkg_version}"
  adsk_xml_template: "adsk.xml.tpl"
  packages:
  - id: ${component_name}-headers_${osName}_${compiler}
    sources:
    - include: "${build_dir}/${config}/include/**/*"
      exclude: ''
      target: "inc"
    dependencies: []
  - id: ${component_name}-resources_${osName}-${distro}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/resources/**/*"
      exclude: ''
      target: "resources"
    dependencies: []
  - id: ${component_name}_${osName}-${distro}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/bin/**/*"
      exclude: ''
      target: "bin"
    dependencies: 
    - package_name: ${component_name}-translations
      version: "${pkg_version}"
    - package_name: ${component_name}-plugins_${osName}-${distro}_${config}_${compiler}_${toolchain}
      version: "${pkg_version}"
  - id: ${component_name}-compilers_${osName}-${distro}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/compilers/**/*"
      exclude: ''
      target: "compilers"
    - include: "${build_dir}/${config}/mkspecs/**/*"
      exclude: ''
      target: "mkspecs"
    dependencies: []
  - id: ${component_name}-lib_${osName}-${distro}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/lib/**/*"
      exclude: ''
      target: "libs"
    - include: "${build_dir}/${config}/metatypes/**/*"
      exclude: ''
      target: "metatypes"
    dependencies: 
    - package_name: ${component_name}-headers_${osName}_${compiler}
      version: "${pkg_version}"
    - package_name: ${component_name}_${osName}-${distro}_${config}_${compiler}_${toolchain}
      version: "${pkg_version}"
  - id: ${component_name}-plugins_${osName}-${distro}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/plugins/**/*"
      exclude: ''
      target: "plugins"
    dependencies: []
  - id: ${component_name}-qml_${osName}-${distro}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/qml/**/*"
      exclude: ''
      target: "qml"
    dependencies: []
  - id: ${component_name}-webengine_${osName}-${distro}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/libexec/QtWebEngineProcess*"
      exclude: ''
      target: "libexec"
    dependencies: 
    - package_name: ${component_name}-resources_${osName}-${distro}_${toolchain}
      version: "${pkg_version}"
