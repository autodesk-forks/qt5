    dependencies: []
  - id: ${component_name}_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}\\${config}\\bin\\*.dll"
      exclude: ''
      target: "bin"
    dependencies: 
    - package_name: ${component_name}-translations
      version: "${pkg_version}"
    - package_name: ${component_name}-plugins_${osName}_${config}_${compiler}_${toolchain}
      version: "${pkg_version}"
  - id: ${component_name}-compilers_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}\\${config}\\compilers\\**\\*"
      exclude: ''
      target: "compilers"
    - include: "${build_dir}\\${config}\\mkspecs\\**\\*"
