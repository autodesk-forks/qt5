    dependencies: []
  - id: ${component_name}-qml_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}\\${config}\\qml\\**\\*"
      exclude: '*.pdb'
      target: "qml"
    dependencies: []
  - id: ${component_name}-webengine_${osName}_${config}_${compiler}_${toolchain}
    sources:
