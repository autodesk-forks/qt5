    - package_name: ${component_name}-resources_${osName}_${toolchain}
      version: "${pkg_version}"
  - id: ${component_name}-sym_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}\\${config}\\bin\\**\\*.pdb"
      exclude: ''
      target: "bin"
    - include: "${build_dir}\\${config}\\lib\\**\\*.pdb"
      exclude: ''
      target: "libs"
    - include: "${build_dir}\\${config}\\qml\\**\\*.pdb"
      exclude: ''
      target: "qml"
    - include: "${build_dir}\\${config}\\plugins\\**\\*.pdb"
      exclude: ''
      target: "plugins"
    dependencies: []
