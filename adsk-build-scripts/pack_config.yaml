    dependencies: []
  - id: ${component_name}-headers_${osName}_${compiler}
    sources:
    - include: "${build_dir}/${config}/include/**/*"
      exclude: ''
      target: "inc"
    dependencies: []
  - id: ${component_name}-resources_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/resources/**/*"
      exclude: ''
      target: "resources"
