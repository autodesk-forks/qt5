      version: "${pkg_version}"
  - id: ${component_name}-sym_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/bin/**/*.pdb"
      exclude: ''
      target: "bin"
    - include: "${build_dir}/${config}/lib/**/*.pdb"
      exclude: ''
      target: "libs"
    dependencies: []  
  - id: ${component_name}-compilers_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/compilers/**/*"
      exclude: ''
      target: "compilers"
    - include: "${build_dir}/${config}/mkspecs/**/*"
      exclude: ''
      target: "mkspecs"
    dependencies: []
  - id: ${component_name}-lib_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/lib/cmake/**/*"
      exclude: ''
      target: "libs/cmake"
    - include: "${build_dir}/${config}/lib/**/*"
      exclude: '*.pdb'
      target: "libs"
    - include: "${build_dir}/${config}/metatypes/**/*"
      exclude: ''
      target: "metatypes"
    dependencies: 
    - package_name: ${component_name}-headers_${osName}_${compiler}
      version: "${pkg_version}"
    - package_name: ${component_name}_${osName}_${config}_${compiler}_${toolchain}
      version: "${pkg_version}"
  - id: ${component_name}-plugins_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/plugins/**/*"
      exclude: ''
      target: "plugins"
    dependencies: []
  - id: ${component_name}-qml_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/qml/**/*"
      exclude: ''
      target: "qml"
    dependencies: []
  - id: ${component_name}-webengine_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/bin/QtWebEngineProcess*.exe"
      exclude: ''
      target: "bin"
    dependencies: 
    - package_name: ${component_name}-resources_${osName}_${config}_${compiler}_${toolchain}
      version: "${pkg_version}"
- type: zip
  version: "${pkg_version}"
  adsk_xml_template: "adsk.xml.tpl"
  packages:
  - id: ${component_name}_${osName}_${config}_${compiler}_${toolchain}
    sources:
    - include: "${build_dir}/${config}/**/*"
      exclude: ''
      target: "${pkg_version}"      
