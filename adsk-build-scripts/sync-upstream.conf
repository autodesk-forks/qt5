# Config for SyncFromUpstream.sh — sourced as plain shell.
#
# Defines which branches and which submodules get synced from upstream
# github.com/qt/* into this Autodesk fork's origin (git.autodesk.com/autodesk-forks/*).
#
# Keep SKIP_MODULES aligned with:
#   - adsk-build-scripts/non-lgpl-modules.md
#   - the QT_MODULE_EXCLUDED / QT_MODULE_SKIPPED lists in BuildQtOn*.sh

# Branches to sync 1:1 from upstream -> origin (space-separated).
SYNC_BRANCHES="6.8 6.8.3"

# Upstream base. Per-repo URL is ${UPSTREAM_BASE}/<name>.git
# Superproject upstream is ${UPSTREAM_BASE}/qt5.git
UPSTREAM_BASE="https://github.com/qt"

# Name of the upstream remote we create in each git dir.
UPSTREAM_REMOTE="upstream"

# Modules to skip. GPL-only + docs-only + LGPL-but-build-excluded.
SKIP_MODULES="
  qtactiveqt qthttpserver qtquickeffectmaker qtgrpc qtvirtualkeyboard
  qtquicktimeline qtquick3d qtnetworkauth qtdatavis3d qtcharts
  qtquick3dphysics qtlottie qtcoap qtmqtt qtgraphs qtwebglplugin
  qtdoc
  qtlocation qttranslations
"

# Also auto-skip submodules marked status=ignore in .gitmodules
# (qtxmlpatterns, qtsystems, qtfeedback, qtpim, qtcanvas3d, qtgamepad).
SKIP_IGNORED_SUBMODULES=1

# Default push behaviour. CLI --force overrides to 1 (uses --force-with-lease).
ALLOW_FORCE_PUSH=0

# Continue past per-module errors (0) vs abort on first failure (1).
# CLI --fail-fast overrides.
FAIL_FAST=0
